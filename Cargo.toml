[workspace]
resolver = "2"
members = ["crates/geom", "crates/doc", "crates/app", "crates/on3dm"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

# Numeric NURBS code indexes several arrays with the same loop variable and
# passes many scalar parameters; rewriting those as iterators hurts clarity.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
