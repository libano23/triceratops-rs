[workspace]
resolver = "2"
members = ["crates/geom", "crates/doc", "crates/app", "crates/on3dm", "crates/kernel"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# one pin for every solidcore crate (docs/superpowers/specs/2026-11-27-solidcore-kernel-design.md)
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "85298b6c435a64def982c944ccee213d94feeb97" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "85298b6c435a64def982c944ccee213d94feeb97" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "85298b6c435a64def982c944ccee213d94feeb97" }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

# Numeric NURBS code indexes several arrays with the same loop variable and
# passes many scalar parameters; rewriting those as iterators hurts clarity.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
