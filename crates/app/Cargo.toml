[package]
name = "triceratops"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "triceratops"
path = "src/main.rs"

[features]
# On while 0.5.0 is developed; `--no-default-features` builds without it.
default = ["kernel-solidcore"]
# Exact solids on the solidcore kernel (docs/superpowers/specs/2026-11-27-solidcore-kernel-design.md).
kernel-solidcore = ["dep:tri-kernel", "tri-kernel/solidcore", "tri-doc/kernel-solidcore"]

[dependencies]
tri-geom = { path = "../geom" }
tri-kernel = { path = "../kernel", optional = true }
tri-doc = { path = "../doc" }
glam.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
winit = "0.30"
wgpu = "30"
egui = { version = "0.37", features = ["default_fonts"] }  # fonts are no longer a default feature
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = "0.37"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rfd = "0.15"
cadcraft-fonts = { git = "https://github.com/storytold/cadcraft", package = "cadcraft-fonts" }
cadcraft-geom = { git = "https://github.com/storytold/cadcraft", package = "cadcraft-geom" }
serde = { workspace = true, features = ["derive"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
interprocess = "2"
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
serde_json.workspace = true
rhai = { version = "1.27.0", features = ["sync", "no_module"] }
# update check: HTTPS with rustls (no OpenSSL) and SHA-256 of downloads
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
