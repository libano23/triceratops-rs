[package]
name = "tri-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exact B-rep solids on the solidcore kernel (docs/superpowers/specs/2026-11-27-solidcore-kernel-design.md).
solidcore = ["dep:solidcore-ops", "dep:solidcore-record", "dep:solidcore-tess"]

[dependencies]
glam.workspace = true
tri-geom = { path = "../geom" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "85298b6c435a64def982c944ccee213d94feeb97", optional = true }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "85298b6c435a64def982c944ccee213d94feeb97", optional = true }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "85298b6c435a64def982c944ccee213d94feeb97", optional = true }
