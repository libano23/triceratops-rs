[package]
name = "tri-doc"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exact solids (docs/superpowers/specs/2026-11-27-solidcore-kernel-design.md): STEP export from the kernel body.
kernel-solidcore = ["dep:tri-kernel", "tri-kernel/solidcore"]

[dependencies]
flate2 = "1"
roxmltree = "0.21"
crc32fast = "1"
tri-geom = { path = "../geom" }
tri-kernel = { path = "../kernel", optional = true }
on3dm = { path = "../on3dm" }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
cadcraft-io = { git = "https://github.com/storytold/cadcraft", package = "cadcraft-io" }
cadcraft-doc = { git = "https://github.com/storytold/cadcraft", package = "cadcraft-doc" }
cadcraft-geom = { git = "https://github.com/storytold/cadcraft", package = "cadcraft-geom" }
cadcraft-color = { git = "https://github.com/storytold/cadcraft", package = "cadcraft-color" }
cadcraft-constraints = { git = "https://github.com/storytold/cadcraft", package = "cadcraft-constraints" }

[lints]
workspace = true

[dev-dependencies]
solidcore-record.workspace = true
