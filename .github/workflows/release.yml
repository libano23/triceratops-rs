name: Build

# Builds the Linux AppImage and the Windows zip.
# Every run uploads them as workflow artifacts; pushing a `v*` tag also
# attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "scripts/**"
      - "**/build.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # start the Website workflow after a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04 # oldest supported glibc (2.35) for the AppImage
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-linux.sh
      # the bridge ships inside the same executable: check it answers MCP over stdio
      - run: python3 scripts/mcp-smoke.py target/release/triceratops
      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pwsh scripts/package-windows.ps1
      # release builds use the GUI subsystem: check stdin/stdout still reach `triceratops.exe mcp`
      - run: python scripts/mcp-smoke.py target/release/triceratops.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      # the notes are this version's section of CHANGELOG.md; no section, no release
      # (checked out first: checkout cleans the folder the artifacts are downloaded to)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            scripts/changelog_section.py
      - run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
      # A release made with GITHUB_TOKEN does not trigger other workflows by
      # itself; a manual dispatch does, so the website picks up the new files.
      - name: Update the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
